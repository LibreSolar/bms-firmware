name: Documentation

on: [push, pull_request]

jobs:
  docs:
    # Avoid running twice if pushing to a PR branch in the base repo
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # necessary to get tags

      - name: Install dependencies
        run: |
          sudo apt install -y git make python3 python3-pip doxygen graphviz
          pip3 install -r docs/requirements.txt

      - name: Build documentation
        run: |
          cd docs
          make html

      - name: Deploy to gh-pages
        # Build docs on all branches to catch errors early, but only publish main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html/
          enable_jekyll: false
          allow_empty_commit: false
          force_orphan: true
          publish_branch: gh-pages
