# Sysbuild configuration file

# Use MCUboot as bootloader
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Keep the MCUboot behavior of Zephyr < v4.5 on Espressif SoCs (overwrite-only, unsigned images)
# so that new application images stay compatible with bootloaders already deployed in the field.
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
